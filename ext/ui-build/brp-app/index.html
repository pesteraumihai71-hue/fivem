<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Basarabia RP</title>
<style>
  :root{
    --night:#0b0d12;
    --panel:rgba(12,14,20,.78);
    --line:rgba(200,204,212,.12);
    --text:#c8ccd4;
    --muted:#7b808b;
    --white:#f3f4f6;
    --signal:#e3192d;
    --signal-hi:#f02a3d;
    --display:"Bahnschrift","Segoe UI",Arial,sans-serif;
    --body:"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--text);font:400 16px/1.5 var(--body);user-select:none;-webkit-font-smoothing:antialiased}
  body{background:url(static/media/32000f5a0b55eccb6d79bg2.jpg) center/cover no-repeat,var(--night)}

  .shell{position:absolute;inset:0;display:grid;grid-template-columns:minmax(380px,560px) 1fr;gap:6vw;padding:7vh 6vw 9vh}

  /* stanga: identitate + actiuni */
  .left{display:flex;flex-direction:column;justify-content:center}
  .logo{width:min(380px,30vw);filter:drop-shadow(0 18px 40px rgba(0,0,0,.65));margin-left:-12px}
  .tag{margin:14px 0 0;font:600 20px/1.2 var(--display);letter-spacing:.02em;color:var(--white)}
  .online{margin:8px 0 0;color:var(--muted);font-size:15px;min-height:22px}
  .online b{color:var(--white);font-weight:600}
  .actions{margin-top:36px;display:flex;flex-direction:column;gap:12px;max-width:380px}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;transition:background-color .15s,transform .1s}
  button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  .play{background:var(--signal);color:#fff;font:700 30px/1 var(--display);letter-spacing:.04em;padding:22px 26px;text-align:left;
        box-shadow:0 14px 40px rgba(227,25,45,.35),inset 0 -4px 0 rgba(0,0,0,.25)}
  .play:hover{background:var(--signal-hi)}
  .play:active{transform:translateY(1px)}
  .row{display:flex;gap:10px}
  .ghost{flex:1;background:rgba(22,25,33,.92);color:var(--white);border:1px solid var(--line);padding:13px 16px;font-weight:600;text-align:left}
  .ghost:hover{background:rgba(40,44,56,.95)}

  /* conectare */
  .connect{display:none;margin-top:36px;max-width:440px}
  .connect h2{margin:0;font:700 26px/1.2 var(--display);color:var(--white)}
  .connect p{margin:8px 0 0;color:var(--text);min-height:24px}
  .bar{margin-top:18px;height:6px;background:rgba(243,244,246,.1);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .3s}
  .bar.indeterminate i{width:35%;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .connect .ghost{margin-top:22px;flex:none;width:auto;display:inline-block}
  .error h2{color:var(--signal-hi)}
  .error p{color:var(--white);white-space:pre-line;max-height:40vh;overflow:auto;user-select:text}

  body[data-state="connecting"] .actions,body[data-state="error"] .actions{display:none}
  body[data-state="connecting"] #connecting{display:block}
  body[data-state="error"] #error{display:block}

  /* dreapta: noutati */
  .right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
  .news{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 28px;backdrop-filter:blur(6px)}
  .news h3{margin:0 0 16px;font:700 22px/1.2 var(--display);color:var(--white)}
  .news article{padding:14px 0;border-top:1px solid var(--line)}
  .news article:first-of-type{border-top:0;padding-top:0}
  .news time{display:block;color:var(--muted);font-size:13px}
  .news h4{margin:2px 0 4px;color:var(--white);font-size:17px}
  .news p{margin:0;font-size:15px}
  .news .empty{color:var(--muted)}

  .foot{position:absolute;left:6vw;right:6vw;bottom:3.5vh;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

  @media (max-width:1100px){.shell{grid-template-columns:1fr}.right{display:none}}
  @media (prefers-reduced-motion:reduce){.bar.indeterminate i{animation:none;width:100%}}
</style>
</head>
<body data-state="idle">
  <div class="shell">
    <section class="left">
      <img class="logo" src="static/media/logo.png" alt="Basarabia RP">
      <p class="tag">Server de roleplay pe GTA V</p>
      <p class="online" id="online"></p>

      <div class="actions">
        <button class="play" id="play" autofocus>JOACĂ</button>
        <div class="row">
          <button class="ghost" id="discord">Discord</button>
          <button class="ghost" id="quit">Ieșire</button>
        </div>
      </div>

      <div class="connect" id="connecting">
        <h2>Se conectează la Basarabia RP</h2>
        <p id="status">Se pregătește conexiunea…</p>
        <div class="bar indeterminate" id="bar"><i></i></div>
        <button class="ghost" id="cancel">Anulează</button>
      </div>

      <div class="connect error" id="error">
        <h2>Nu te-ai putut conecta</h2>
        <p id="errorText"></p>
        <div class="row" style="margin-top:22px">
          <button class="ghost" id="retry">Încearcă din nou</button>
          <button class="ghost" id="quit2">Ieșire</button>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="news">
        <h3>Noutăți</h3>
        <div id="newsList"><p class="empty">Se încarcă…</p></div>
      </div>
    </aside>
  </div>

  <div class="foot"><span>Basarabia Roleplay</span><span id="ver"></span></div>

<script>
  // ---------------------------------------------------------------------------
  // Configurare (schimbati aici daca se muta serverul)
  // ---------------------------------------------------------------------------
  var BRP = {
    server: "134.255.225.49:30178",
    news: "https://pesteraumihai71-hue.github.io/fivem/news.json",
    discord: "https://discord.gg/"   // linkul de invitatie al serverului
  };

  var native = function (name, arg) {
    try { if (window.invokeNative) window.invokeNative(name, arg == null ? "" : arg); } catch (e) {}
  };

  var $ = function (id) { return document.getElementById(id); };
  var setState = function (s) { document.body.setAttribute("data-state", s); };

  // ---------------------------------------------------------------------------
  // Traduceri pentru mesajele de conectare
  // ---------------------------------------------------------------------------
  var ro = [
    [/^Connecting to server\.*$/i, "Se conectează la server…"],
    [/^Handshaking with server\.*$/i, "Se stabilește conexiunea…"],
    [/^Downloading content\.*$/i, "Se descarcă resursele serverului…"],
    [/^Verifying content\.*$/i, "Se verifică resursele…"],
    [/^Loading game\.*$/i, "Se încarcă jocul…"],
    [/^Requesting server variables\.*$/i, "Se citesc setările serverului…"],
    [/^Obtaining Steam ticket\.*$/i, "Se verifică Steam…"]
  ];
  function translate(msg) {
    msg = String(msg || "");
    for (var i = 0; i < ro.length; i++) if (ro[i][0].test(msg)) return ro[i][1];
    return msg;
  }

  // ---------------------------------------------------------------------------
  // Actiuni
  // ---------------------------------------------------------------------------
  function connect() {
    setState("connecting");
    $("status").textContent = "Se conectează la server…";
    $("bar").classList.add("indeterminate");
    native("connectTo", JSON.stringify([BRP.server]));
  }

  $("play").addEventListener("click", connect);
  $("retry").addEventListener("click", connect);
  $("cancel").addEventListener("click", function () { native("cancelDefer"); setState("idle"); $("play").focus(); });
  $("quit").addEventListener("click", function () { native("exit"); });
  $("quit2").addEventListener("click", function () { native("exit"); });
  $("discord").addEventListener("click", function () { native("openUrl", BRP.discord); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && document.body.getAttribute("data-state") === "idle") connect();
  });

  // ---------------------------------------------------------------------------
  // Mesaje de la client (conectare automata, progres, erori)
  // ---------------------------------------------------------------------------
  window.addEventListener("message", function (event) {
    var d = event.data;
    if (typeof d === "string") { try { d = JSON.parse(d); } catch (e) { return; } }
    if (!d || !d.type) return;

    switch (d.type) {
      case "connecting":
        setState("connecting");
        break;

      case "connectStatus":
        setState("connecting");
        var s = d.data || {};
        $("status").textContent = translate(s.message);
        if (s.total > 0 && s.count >= 0) {
          $("bar").classList.remove("indeterminate");
          $("bar").firstElementChild.style.width = Math.min(100, Math.round(s.count * 100 / s.total)) + "%";
        } else {
          $("bar").classList.add("indeterminate");
        }
        $("cancel").style.display = s.cancelable === false ? "none" : "";
        break;

      case "connectFailed":
        setState("error");
        $("errorText").textContent = String(d.message || "Eroare necunoscută.");
        $("retry").focus();
        break;

      case "connectCard":
        setState("connecting");
        $("status").textContent = "Serverul cere o confirmare – urmează instrucțiunile din joc.";
        break;

      case "setWarningMessage":
        if (d.message) { setState("error"); $("errorText").textContent = String(d.message); }
        break;
    }
  });

  // ---------------------------------------------------------------------------
  // Noutati (fisier editabil pe site: news.json) si jucatori online
  // ---------------------------------------------------------------------------
  function esc(s) { var x = document.createElement("div"); x.textContent = String(s == null ? "" : s); return x.innerHTML; }

  fetch(BRP.news, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (list) {
    if (!Array.isArray(list) || !list.length) throw 0;
    $("newsList").innerHTML = list.slice(0, 4).map(function (n) {
      return "<article><time>" + esc(n.date) + "</time><h4>" + esc(n.title) + "</h4><p>" + esc(n.text) + "</p></article>";
    }).join("");
  }).catch(function () {
    $("newsList").innerHTML = '<p class="empty">Noutățile nu sunt disponibile acum.</p>';
  });

  fetch("http://" + BRP.server + "/dynamic.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
    if (typeof s.clients === "number") {
      $("online").innerHTML = "<b>" + s.clients + "</b> / " + esc(s.sv_maxclients || "?") + " jucători online";
    }
  }).catch(function () {});

  // ---------------------------------------------------------------------------
  // Pornire: anuntam clientul ca meniul e incarcat (afiseaza fereastra jocului)
  // ---------------------------------------------------------------------------
  native("getMinModeInfo");
</script>
</body>
</html>
