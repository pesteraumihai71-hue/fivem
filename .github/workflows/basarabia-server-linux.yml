# ============================================================================
#  Basarabia RP - build server propriu (fara txAdmin) pentru Linux
#
#  Rezultat: basarabia-server-linux.tar.xz (acelasi format ca artifactele
#  oficiale Linux: alpine/ + run.sh), atasat la un Release "server-<versiune>"
#  marcat ca pre-release (NU devine "latest", ca sa nu afecteze butonul de
#  descarcare de pe site).
#
#  Pornire: Actions -> "Basarabia RP - Build server (Linux)" -> Run workflow.
# ============================================================================

name: Basarabia RP - Build server (Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiunea serverului (ex. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Eliberare spațiu pe disc
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Clonare cod + submodule
        run: |
          git config --global core.symlinks true
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
          cd src
          git checkout ${{ github.sha }}
          git submodule update --init --depth=1 --jobs=8

      - name: Imagine de build (Alpine + proot)
        working-directory: src
        run: docker build -t brp-server-builder -f code/tools/ci/docker-builder/Dockerfile .

      - name: Node 12 (musl) pentru generarea nativelor
        run: |
          mkdir -p /tmp/brp-node
          for u in \
            https://unofficial-builds.nodejs.org/download/release/v12.22.12/node-v12.22.12-linux-x64-musl.tar.gz \
            https://content.cfx.re/mirrors/vendor/node/v12.22.12/node-v12.22.12-linux-x64-musl.tar.gz; do
            curl -fL --retry 5 --retry-delay 5 -o /tmp/brp-node/node.tar.gz "$u" && break
          done
          ls -la /tmp/brp-node

      - name: Build server (durează)
        working-directory: src
        run: |
          set -o pipefail
          report_failure() {
            enc() { sed -e 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"} {print}'; }
            echo "::error title=Build server - linii cu erori::$(grep -nE '(error|Error|ERR!|FAILED|failed|No such file|not found)' /tmp/build.log | grep -v 'Werror' | tail -n 30 | enc)"
            echo "::error title=Build server - ultimele 30 de linii::$(tail -n 30 /tmp/build.log | enc)"
            exit 1
          }
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -v /tmp/brp-node:/tmp/node \
            -e JOB_SLOTS=$(nproc) \
            -e CI_PIPELINE_ID=${{ github.run_number }} \
            brp-server-builder sh -exc '
              # resursa de sistem "chat" (din codul public). FARA txAdmin (monitor):
              # serverul Basarabia RP porneste direct cu server.cfg.
              (cd ext/system-resources && sh build.sh)
              rm -rf ext/system-resources/data/monitor

              # compilarea propriu-zisa (scriptul public Cfx, fara componente private)
              sh code/tools/ci/build_server_docker_alpine_public.sh

              # impachetare, ca artifactele oficiale Linux
              cp -a alpine/lib/ld-musl-x86_64.so.1 alpine/opt/cfx-server/
              mkdir -p alpine/opt/cfx-server/citizen/system_resources/
              cp -a ext/system-resources/data/* alpine/opt/cfx-server/citizen/system_resources/
              rm -f alpine/opt/cfx-server/*.dbg
              # componenta inchisa Cfx (svadhesive) nu exista in buildul public -> o scoatem din lista
              sed -i '/"svadhesive"/d' alpine/opt/cfx-server/components.json
              grep -q svadhesive alpine/opt/cfx-server/components.json && exit 1 || true
              rm -rf alpine/src alpine/fivem-private
              cp -a data/server_proot/* .
              chmod +x run.sh
              XZ_OPT=-T0 tar cJf basarabia-server-linux.tar.xz alpine/ run.sh
              chown $(stat -c %u .):$(stat -c %g .) basarabia-server-linux.tar.xz
            ' 2>&1 | tee /tmp/build.log || report_failure
          ls -la basarabia-server-linux.tar.xz

      - name: Log build (la eroare)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: basarabia-server-linux-${{ inputs.version }}
          path: src/basarabia-server-linux.tar.xz
          retention-days: 30

      - name: Release (pre-release, nu "latest")
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="server-${{ inputs.version }}"
          gh release delete "$tag" -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" basarabia-server-linux.tar.xz \
            -R "${{ github.repository }}" --target ${{ github.sha }} \
            --prerelease --latest=false \
            --title "Basarabia RP server ${{ inputs.version }} (Linux)" \
            --notes "Server propriu Basarabia RP, fără Cfx.re și fără txAdmin. Instrucțiuni: basarabia/SERVER-PROPRIU.md"
