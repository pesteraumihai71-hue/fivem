# ============================================================================
#  Basarabia RP - build automat al clientului + installer
#
#  Pornire: GitHub -> tab-ul "Actions" -> "Basarabia RP - Build client"
#           -> "Run workflow". La final descărcați "BasarabiaRP-Setup" din
#           secțiunea Artifacts a rulării.
# ============================================================================

name: Basarabia RP - Build client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiunea installerului (ex. 1.0.1)"
        required: true
        default: "1.0.0"
      runner:
        description: "Pe ce mașină rulează (windows-2022 = gratuit GitHub; self-hosted = VPS-ul vostru)"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - windows-2022
          - self-hosted
      publish:
        description: "Publică installerul pentru jucători (link public de descărcare)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write   # necesar pentru publicarea installerului (Release)

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      # Variabilele pe care le așteaptă scripturile oficiale Cfx (code/tools/ci)
      CI: "true"
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_PIPELINE_ID: ${{ github.run_number }}
      CFX_PRODUCT_NAME: fivem
      # Opțional: componentele private Cfx (dacă Cfx.re v-a dat acces).
      # Se setează în Settings -> Secrets and variables -> Actions.
      FIVEM_PRIVATE_URI: ${{ secrets.FIVEM_PRIVATE_URI }}
      FIVEM_CLOSED_URI: ${{ secrets.FIVEM_CLOSED_URI }}
      # Repo-ul se clonează pe C: (mai mult spațiu decât D: pe mașinile GitHub)
      CI_PROJECT_DIR: C:\brp

    steps:
      - name: Spațiu pe disc (înainte)
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Liber (GB)';e={[math]::Round($_.Free/1GB,1)}}

      - name: Clonare cod (istoric complet, necesar pentru versiuni)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          git config --global core.longpaths true
          if (Test-Path C:\brp\.git) {
            git -C C:\brp fetch origin ${{ github.sha }}
            git -C C:\brp reset --hard ${{ github.sha }}
          } else {
            git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" C:\brp
            git -C C:\brp checkout ${{ github.sha }}
          }

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node.js + Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependențe build
        shell: pwsh
        run: |
          python -m pip install --upgrade setuptools
          if (-not (Get-Command yarn -ErrorAction SilentlyContinue)) { npm install -g yarn }
          if (-not (Test-Path C:\msys64)) { throw "Lipsește MSYS2 la C:\msys64 (necesar pentru build)" }

      - name: Build client (durează câteva ore)
        shell: pwsh
        working-directory: C:\brp
        run: .\basarabia\ci\build.ps1

      - name: Installer (Inno Setup)
        shell: pwsh
        working-directory: C:\brp
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ inputs.version }} basarabia\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BasarabiaRP-Setup-${{ inputs.version }}
          path: C:\brp\basarabia\output\BasarabiaRP-Setup.exe
          retention-days: 30

      # Publică installerul pentru jucători (fără cont GitHub).
      # Link fix, mereu ultima versiune:
      #   https://github.com/pesteraumihai71-hue/fivem/releases/latest/download/BasarabiaRP-Setup.exe
      - name: Publicare pentru jucători (Release)
        if: inputs.publish
        shell: pwsh
        working-directory: C:\brp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release delete $tag -R ${{ github.repository }} --yes --cleanup-tag 2>$null
          gh release create $tag "basarabia\output\BasarabiaRP-Setup.exe" `
            -R ${{ github.repository }} --target ${{ github.sha }} --latest `
            --title "Basarabia RP $tag" `
            --notes "Installer Basarabia Roleplay $tag. Necesită GTA V instalat."

      - name: Spațiu pe disc (după)
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Liber (GB)';e={[math]::Round($_.Free/1GB,1)}}
